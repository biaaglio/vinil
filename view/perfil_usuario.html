<?php
    session_start();
    if (!isset($_SESSION['id_usuario'])) {
        header("Location: ../view/login_usuario.html");
        exit;
    }

    require_once "../assets/processamento/funcoesDB.php";
    $usuario = buscarUsuarioId($_SESSION['id_usuario']);

    if (!$usuario && !empty($_SESSION['email_usuario'])) {
        $usuario = buscarUsuarioEmail($_SESSION['email_usuario']);
        if ($usuario) {
            $_SESSION['id_usuario'] = $usuario['id_usuario'];
            $_SESSION['nivel_acesso'] = $usuario['nivel_acesso'];
        }
    }

    if (!$usuario) {
        session_destroy();
        header("Location: ../view/login_usuario.html");
        exit;
    }

    $partesNome = explode(" ", trim($usuario['nome']));
    $iniciais = strtoupper(substr($partesNome[0], 0, 1) . (isset($partesNome[1]) ? substr($partesNome[1], 0, 1) : ''));
    $anoCadastro = !empty($usuario['criado_em']) ? date('Y', strtotime($usuario['criado_em'])) : '2026';
    $dataNasc = !empty($usuario['data_nascimento']) ? date('d/m/Y', strtotime($usuario['data_nascimento'])) : 'Não informada';
    $_SESSION['nivel_acesso'] = $usuario['nivel_acesso'];
    $isAdmin = ($usuario['nivel_acesso'] ?? '') === 'adm';
?>
