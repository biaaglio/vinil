<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Álbum</title>
    <link rel="stylesheet" href="/vinil/assets/style.css">
</head>
<body>
    <main>
        <article class="main-dispo">
            <a href="../view/home.html"><img class="logo" src="../assets/img/logo_vinil_fundo_transparente.png" alt="logo"></a>
        </article>

        <article class="main-dispo">
            <ul>
                <a href="../view/albuns.html"><li>Álbuns</li></a>
                <a href="../view/generos.html"><li>Gêneros</li></a>
                <a href="../view/artistas.html"><li>Artistas</li></a>
                <a href="../view/novidades.html"><li>Novidades</li></a>
            </ul>
        </article>

        <article class="main-dispo">
            <img class="icon" src="../assets/img/icons-pesquisar.png" alt="gostei">
            <img class="icon" src="../assets/img/icons-gostar.png" alt="gostei">
            <img class="icon" src="../assets/img/icons-usuário.png" alt="gostei">
        </article>
    </main>

    <section class="sessao-cad-album">
        <form class="box-cad-album">
            <h1>Cadastrar novo álbum</h1>

            <section class="cad-album-topo">
                <article class="cad-capa-box">
                    <label class="cad-capa" for="capa">
                        <img class="icone-upload" src="../assets/img/icons-upload.png" alt="">
                        <p>Arraste a capa aqui<br>ou clique para enviar</p>
                    </label>
                    <input id="capa" type="file" accept="image/png, image/jpeg" hidden>
                    <small>JPG ou PNG</small>
                </article>

                <article class="cad-campos">
                    <label class="campo-total">Título do álbum
                        <input type="text" placeholder="Título do álbum">
                    </label>

                    <label class="campo">Artista
                        <input id="cad-artista" type="text" placeholder="Nome do artista">
                    </label>

                    <label class="campo">Gênero
                        <select>
                            <option>Rock</option>
                            <option>MPB</option>
                            <option>Pop</option>
                            <option>Rap / Hip-Hop</option>
                            <option>Rap Nacional</option>
                            <option>Eletrônica</option>
                        </select>
                    </label>

                    <label class="campo">Ano de lançamento
                        <input type="number" min="1900" max="2100" placeholder="Ano">
                    </label>

                    <label class="campo">Gravadora
                        <input type="text" placeholder="Gravadora">
                    </label>

                    <label class="campo">Link para comprar álbum
                        <input type="url" placeholder="https://">
                    </label>

                    <label class="campo">Link para escutar
                        <input type="url" placeholder="https://">
                    </label>

                    <label class="campo-total">Descrição
                        <textarea placeholder="Conte um pouco sobre o álbum"></textarea>
                    </label>
                </article>
            </section>

            <section class="cad-faixas">
                <h3>Faixas</h3>

                <article class="faixa-linha">
                    <span>01</span>
                    <input class="faixa-nome" type="text" placeholder="Nome da faixa">
                    <input class="faixa-tempo" type="text" placeholder="0:00">
                    <button class="faixa-remover" type="button">✕</button>
                </article>

                <article class="faixa-linha">
                    <span>02</span>
                    <input class="faixa-nome" type="text" placeholder="Nome da faixa">
                    <input class="faixa-tempo" type="text" placeholder="0:00">
                    <button class="faixa-remover" type="button">✕</button>
                </article>

                <button class="faixa-add" type="button">+ Adicionar faixa</button>
            </section>

            <article class="cad-botoes">
                <a href="../view/albuns.html"><button class="button-contorno" type="button">Cancelar</button></a>
                <button class="button-ama" type="submit">Salvar álbum</button>
            </article>
        </form>
    </section>
</body>
</html>
