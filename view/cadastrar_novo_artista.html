<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Artista</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

    <main>
        <article class="main-dispo">
            <a href="../view/home.html">
                <img class="logo" src="../assets/img/logo_vinil_fundo_transparente.png" alt="logo">
            </a>
        </article>

        <article class="main-dispo">
            <ul>
                <a href="../view/albuns.php"><li>Álbuns</li></a>
                <a href="../view/generos.html"><li>Gêneros</li></a>
                <a class="ativo" href="../view/artistas.html"><li>Artistas</li></a>
                <a href="../view/novidades.html"><li>Novidades</li></a>
            </ul>
        </article>

        <article class="main-dispo">
            <img class="icon" src="../assets/img/icons-pesquisar.png" alt="pesquisar">
            <a href="../view/curtidos_usuario.html"><img class="icon" src="../assets/img/icons-gostar.png" alt="gostei"></a>
            <img class="icon" src="../assets/img/icons-usuário.png" alt="usuário">
        </article>
    </main>

    <section class="sessao-cad-album">

        <form class="box-cad-album" method="POST" action="" enctype="multipart/form-data">

            <h1>Cadastrar novo artista</h1>

            <section class="cad-album-topo">

                <article class="cad-capa-box">
                    <label class="cad-capa" for="capa">
                        <img class="icone-upload" src="../assets/img/icons-upload.png" alt="">
                        <p>Arraste a foto aqui<br>ou clique para enviar</p>
                    </label>
                    <input type="file" id="capa" name="foto" accept="image/png, image/jpeg" hidden>

                    <small>JPG ou PNG, até 2 MB</small>
                </article>

                <article class="cad-campos">

                    <label class="campo-total">Nome do artista
                        <input type="text" name="nome" placeholder="Pink Floyd" required>
                    </label>

                    <label class="campo">Gênero principal
                        <select name="genero" required>
                            <option value="">Selecione o gênero</option>
                            <option value="Rock">Rock</option>
                            <option value="MPB">MPB</option>
                            <option value="Pop">Pop</option>
                            <option value="Rap">Rap</option>
                            <option value="Eletrônica">Eletrônica</option>
                        </select>
                    </label>

                    <label class="campo">País de origem
                        <input type="text" name="pais" placeholder="País de origem">
                    </label>

                    <label class="campo">Ano de início
                        <input type="number" name="anoInicio" min="1900" max="2100" placeholder="Ano">
                    </label>

                    <label class="campo">Link para escutar
                        <input type="url" name="linkSpotify" placeholder="https://">
                    </label>

                    <label class="campo-total">Biografia
                        <textarea name="biografia" placeholder="Conte um pouco sobre o artista"></textarea>
                    </label>

                </article>
            </section>

            <article class="cad-botoes">

                <a href="../view/artistas.html">
                    <button class="button-contorno" type="button">Cancelar</button>
                </a>

                <button class="button-ama" type="submit" name="cadastrar">
                    Salvar artista
                </button>

            </article>

        </form>

    </section>

</body>
</html>
